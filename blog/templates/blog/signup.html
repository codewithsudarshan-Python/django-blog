{% load django_bootstrap5 %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - My Django Blog</title>
    {% bootstrap_css %}
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .signup-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        .navbar {
            background: rgba(0,0,0,0.3) !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">My Django Blog</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="signup-card">
                    <h2 class="text-center mb-4">Create Account</h2>
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select">
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                                <option value="O">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="age" class="form-control" placeholder="e.g. 22">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Place</label>
                            <input type="text" name="place" class="form-control" placeholder="e.g. Pune">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Degree</label>
                            <select name="degree" class="form-select">
                                <option value="BCA">BCA</option>
                                <option value="BSc">BSc</option>
                                <option value="BCom">BCom</option>
                                <option value="BE/BTech">BE/BTech</option>
                                <option value="MCA">MCA</option>
                                <option value="MSc">MSc</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <select name="course" class="form-select">
                                <option value="Python">Python</option>
                                <option value="Java">Java</option>
                                <option value="Web Development">Web Development</option>
                                <option value="Django">Django</option>
                                <option value="Data Structures">Data Structures</option>
                                <option value="C++">C++</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="Machine Learning">Machine Learning</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password1" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="password2" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Sign Up</button>
                    </form>
                    <p class="text-center mt-3">Already have an account? <a href="{% url 'login' %}">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    {% bootstrap_javascript %}
</body>
</html>
