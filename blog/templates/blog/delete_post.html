{% load django_bootstrap5 %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post - My Django Blog</title>
    {% bootstrap_css %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">My Django Blog</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4 text-danger">Delete Post</h2>
                <p class="text-center">Are you sure you want to delete "<strong>{{ post.title }}</strong>"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100">Yes, Delete Post</button>
                </form>
                <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
            </div>
        </div>
    </div>

    {% bootstrap_javascript %}
</body>
</html>
